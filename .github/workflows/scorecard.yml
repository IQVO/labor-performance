name: OpenSSF Scorecard

on:
  # Scorecard's action itself refuses to run on push events targeting
  # anything but the repo's actual GitHub-configured default branch
  # ("only default branch is supported") -- and this fleet deliberately
  # keeps `develop` as every repo's default branch (GitFlow), not `main`.
  # Triggering on `main` here was a latent, fleet-wide copy-paste bug:
  # confirmed via a real failed run ("refs/heads/main not supported with
  # push event") the first time any repo's Scorecard workflow actually
  # fired, since the schedule/workflow_dispatch triggers never surfaced
  # this branch mismatch before.
  push:
    branches: [develop]
  schedule:
    # Scorecard measures repo-level supply-chain hygiene (branch protection,
    # signed commits, dependency pinning, etc.) — a weekly cadence is the
    # project's own recommendation since most inputs change slowly.
    - cron: "0 8 * * 2"
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # publish results to the public Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
