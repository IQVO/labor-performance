openapi: 3.0.3
info:
  title: Labor Performance Reports API
  description: >
    The READ-ONLY analytical surface of the Labor Performance bounded
    context's data product (ADR 0007), served by the separate
    `cmd/labor-reports` binary over a read-only pool against the analytical
    database — NOT by the OLTP `cmd/labor` binary documented in
    apis/openapi.yaml.

    The report is a projection over this service's own domain events
    (LaborStandardDefined, LaborStandardRevised, TaskPerformanceRecorded),
    delivered on the `warehouse.labor-performance.analytics` topic and
    applied by `cmd/labor-projector` — the single writer. It is therefore
    EVENTUALLY CONSISTENT: use GET /reports/performance/freshness to see how
    far behind the event stream the read model currently is.

    Every mean in this API is NULLABLE, and null is a real answer that
    clients must handle distinctly from zero. An hour bucket can hold real,
    counted tasks and still have no efficiency number — because no
    engineered standard was active at completion time, or because the
    completion carried no measurable duration. Reporting 0 in that case
    would brand an unmeasurable hour as a 0%-efficient one, which this
    context refuses to do (ADR 0004).
  version: "1.0.0"
  license:
    name: MIT
  contact:
    name: Labor Performance Team
    url: https://github.com/IQVO/labor-performance
servers:
  - url: http://localhost:8092
    description: Local development (cmd/labor-reports, HTTP_ADDR default :8092)
tags:
  - name: reports
    description: The Labor Performance Report analytical read model.
  - name: health
    description: Liveness probe.
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getReportsHealthz
      summary: Liveness probe
      description: Reports whether the reports process is up and able to serve requests.
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /reports/performance:
    get:
      tags: [reports]
      operationId: getLaborPerformanceReport
      summary: Labor Performance Report, keyed by TaskType and UTC hour
      description: >
        Returns the labor performance rollup for a half-open time window
        [from, to), as raw (taskType, hour) rows, a per-TaskType breakdown
        suitable for a bar chart, and window totals.

        Rows are bucketed by the BUSINESS time of the underlying event (a
        task's completedAt, a standard's effectiveFrom), never by ingestion
        time, so a replayed or late-projected event lands in the hour the
        work actually happened.

        Note that `taskType` may legitimately be `UNCLASSIFIED`: a
        completion whose task_type was absent or unrecognized
        (e.g. REBIN, which this service does not model) is labelled
        explicitly rather than dropped or given an invented type. Since
        fulfillment-execution's ADR-0023 put task_type on the wire, most
        completions classify; UNCLASSIFIED remains a real, chartable
        bucket for older payloads and lookup misses.
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start of the window, RFC 3339.
          schema:
            type: string
            format: date-time
          example: "2026-09-05T00:00:00Z"
        - name: to
          in: query
          required: true
          description: Exclusive end of the window, RFC 3339. Must be strictly after `from`.
          schema:
            type: string
            format: date-time
          example: "2026-09-06T00:00:00Z"
        - name: taskType
          in: query
          required: false
          description: >
            Optional exact-match filter. Omit for every task type; pass
            `UNCLASSIFIED` to select only the unclassified bucket.
          schema:
            type: string
          example: PICK
        - name: granularity
          in: query
          required: false
          description: Bucket resolution. Only hourly buckets are modelled in this round.
          schema:
            type: string
            enum: [hour]
            default: hour
      responses:
        "200":
          description: >
            The report for the requested window. An empty window is a 200
            with empty `rows`/`byTaskType` arrays and null means — not a 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaborPerformanceReport"
        "400":
          description: The query is malformed or missing a required parameter.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The report could not be served.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /reports/performance/freshness:
    get:
      tags: [reports]
      operationId: getLaborPerformanceReportFreshness
      summary: How far the read model trails the event stream
      description: >
        Returns the age of the most recently projected event: the data
        product's published freshness signal. A growing lag means the
        projector is falling behind or has stopped; a lag of 0 on a
        never-populated read model is indistinguishable from a perfectly
        fresh one, so read it alongside the report's own task counts.
        Target: p95 under 30 seconds.
      responses:
        "200":
          description: The current projection lag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Freshness"
        "500":
          description: The freshness signal could not be read.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    LaborPerformanceReport:
      type: object
      required: [from, to, rows, byTaskType, totals]
      properties:
        from:
          type: string
          format: date-time
          description: The inclusive window start, echoed back in UTC.
        to:
          type: string
          format: date-time
          description: The exclusive window end, echoed back in UTC.
        rows:
          type: array
          description: >
            One row per (taskType, hour bucket), ordered by hour bucket then
            task type. Always present; empty for a window with no data.
          items:
            $ref: "#/components/schemas/ReportRow"
        byTaskType:
          type: array
          description: >
            The window collapsed onto one entry per TaskType — the shape a
            bar chart binds to — sorted by task type so bar order is stable
            across refreshes. A TaskType with no rows in the window is
            ABSENT rather than present with zeros.
          items:
            $ref: "#/components/schemas/TaskTypeBar"
        totals:
          $ref: "#/components/schemas/Totals"

    ReportRow:
      type: object
      required:
        - taskType
        - hourBucket
        - tasksRecorded
        - tasksScored
        - tasksUnscored
        - tasksMeasured
        - standardsDefined
        - standardsRevised
      properties:
        taskType:
          type: string
          description: PICK, PACK, SLAM, or UNCLASSIFIED.
          example: PICK
        hourBucket:
          type: string
          format: date-time
          description: Start of the UTC hour this row aggregates.
          example: "2026-09-05T09:00:00Z"
        tasksRecorded:
          type: integer
          description: >
            Every task recorded in this bucket, including ones with no
            associate (a robot station), no measurable duration, and no
            active standard. The honest denominator.
          example: 8
        tasksScored:
          type: integer
          description: The subset that could be scored against a standard.
          example: 3
        tasksUnscored:
          type: integer
          description: tasksRecorded minus tasksScored; never negative.
          example: 5
        tasksMeasured:
          type: integer
          description: >-
            The subset whose ActualSeconds was positive — the denominator
            of meanActualSeconds. Wider than tasksScored: a task can be
            measured (a real duration) without being scored (no standard
            to compare against), per ADR 0006's distinction.
          example: 6
        meanEfficiencyPct:
          type: number
          format: double
          nullable: true
          description: >
            Mean EfficiencyPct across the SCORED tasks only. NULL when
            nothing in this bucket was scorable — never 0 as a stand-in.
          example: 90
        meanActualSeconds:
          type: number
          format: double
          nullable: true
          description: >
            Mean observed duration across tasks with a positive
            ActualSeconds. Independent of whether any standard existed, so
            it is present for buckets where meanEfficiencyPct is null. NULL
            when nothing in this bucket was measurable.
          example: 50
        standardsDefined:
          type: integer
          description: LaborStandardDefined events effective in this bucket.
          example: 1
        standardsRevised:
          type: integer
          description: >
            LaborStandardRevised events effective in this bucket. Non-zero
            means efficiency figures on either side of this bucket are
            measured against DIFFERENT standards and are not directly
            comparable.
          example: 0

    TaskTypeBar:
      type: object
      required:
        - taskType
        - tasksRecorded
        - tasksScored
        - tasksUnscored
        - tasksMeasured
        - standardsDefined
        - standardsRevised
      properties:
        taskType:
          type: string
          example: PICK
        tasksRecorded:
          type: integer
          example: 12
        tasksScored:
          type: integer
          example: 5
        tasksUnscored:
          type: integer
          example: 7
        tasksMeasured:
          type: integer
          description: The measured subset across the window (denominator of meanActualSeconds).
          example: 9
        meanEfficiencyPct:
          type: number
          format: double
          nullable: true
          description: >
            Recomputed from the summed raw counters across the window, not
            averaged from the per-bucket means, so a busy hour weighs more
            than a quiet one. NULL when no task of this type was scored.
          example: 96.5
        meanActualSeconds:
          type: number
          format: double
          nullable: true
          example: 47.5
        standardsDefined:
          type: integer
          example: 1
        standardsRevised:
          type: integer
          example: 1

    Totals:
      type: object
      description: The entire queried window collapsed to a single headline.
      required: [tasksRecorded, tasksScored, tasksUnscored, tasksMeasured]
      properties:
        tasksRecorded:
          type: integer
          example: 20
        tasksScored:
          type: integer
          example: 5
        tasksUnscored:
          type: integer
          example: 15
        tasksMeasured:
          type: integer
          example: 17
        meanEfficiencyPct:
          type: number
          format: double
          nullable: true
          description: >
            Volume-weighted across every task type. NULL when the window
            contains tasks but none of them were scorable — the headline
            then honestly reads "20 tasks, no score", never "0%".
          example: 96.5
        meanActualSeconds:
          type: number
          format: double
          nullable: true
          example: 47.5

    Freshness:
      type: object
      required: [lagSeconds]
      properties:
        lagSeconds:
          type: number
          format: double
          description: >
            Seconds between now and the occurred_at of the most recently
            projected event. 0 when the read model is empty, and clamped to
            0 rather than going negative for a future-dated event.
          example: 4.2

    Problem:
      type: object
      description: RFC 7807 problem detail, identical in shape to the OLTP API's.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable identifier for the error category.
          example: https://errors.labor-performance.warehouse-systems.dev/invalid-report-query
        title:
          type: string
          description: Fixed human-readable summary of the error category.
          example: The report query is malformed or missing a required parameter
        status:
          type: integer
          description: The HTTP status code, repeated in the body.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: "query parameter 'from' is required (RFC3339)"
        instance:
          type: string
          description: The request path this problem occurred on.
          example: /reports/performance
