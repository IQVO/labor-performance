apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "labor-performance.fullname" . }}
  labels:
    {{- include "labor-performance.labels" . | nindent 4 }}
# Mounted by the api Deployment (cmd/labor) with `envFrom: configMapRef`
# (gap fix D14): every key below is read by cmd/labor. Explicit `env`
# entries in deployment.yaml win over the same key here. The mcp,
# projector and reports Deployments do NOT mount it: they set their own env
# (HTTP_ADDR and OTEL_SERVICE_NAME here are the api's values).
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENVIRONMENT: {{ .Values.environment | quote }}
  KAFKA_CONSUMER_GROUP: {{ .Values.config.kafkaConsumerGroup | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  {{- if .Values.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otel.serviceName | quote }}
  {{- end }}
  {{- if .Values.kafka.enabled }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  {{- end }}
