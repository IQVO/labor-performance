{{- if .Values.a2a.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "labor-performance.a2aFullname" . }}
  labels:
    {{- include "labor-performance.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  {{- /* ADR 0034: cmd/a2a exits at boot without DATABASE_URL. */}}
  {{- include "labor-performance.requireDatabase" . }}
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "labor-performance.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "labor-performance.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "labor-performance.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            # The Agent Card must advertise a URL agent clients can dial:
            # default to this release's in-cluster Service DNS, overridable
            # through a2a.agentUrl. Mandatory: cmd/a2a refuses to boot
            # without it.
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%d/" (include "labor-performance.a2aFullname" .) .Release.Namespace (int .Values.a2a.service.port)) | quote }}
            # cmd/a2a runs the same four read use cases (GetAssociateScorecard,
            # GetTaskTypePerformance, GetStandard, GetUtilization) over the same
            # OLTP database as cmd/labor, and (like it) applies migrations on
            # start — idempotent, so all binaries may point at the same
            # directory. It is read-only: no Kafka, no outbox, no relay.
            - name: MIGRATIONS_PATH
              value: {{ .Values.config.migrationsPath | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "labor-performance-a2a"
            {{- end }}
            # Mandatory (ADR 0034): cmd/a2a exits at boot without it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "labor-performance.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and ADR-0020: cmd/a2a also runs migrations on start (see the
            # comment above), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "labor-performance.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- range .Values.a2a.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # cmd/a2a serves GET /healthz (200 {"status":"ok"}) next to the A2A
          # JSON-RPC endpoint at "/" and "/a2a" (cmd/a2a/router.go), so the
          # probes use httpGet /healthz like the OLTP REST service and the
          # MCP server. /healthz needs no credentials: A2A is unauthenticated
          # by decision (ADR-0012). It answers only once migrations and the
          # database ping have succeeded, because the listener starts after
          # them.
          # startupProbe covers this fleet's known ~10s post-start
          # first-outbound-dial reset (Istio native sidecars); see
          # values.yaml's startupProbe comment for the full rationale.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
