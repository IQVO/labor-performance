{{- if .Values.a2a.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "labor-performance.a2aFullname" . }}
  labels:
    {{- include "labor-performance.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  type: {{ .Values.a2a.service.type }}
  ports:
    - port: {{ .Values.a2a.service.port }}
      targetPort: {{ ternary "a2a" "http" (eq (include "labor-performance.agentsColocated" .) "true") }}
      protocol: TCP
      name: http
  selector:
    {{- include "labor-performance.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "agents" "a2a" (eq (include "labor-performance.agentsColocated" .) "true") }}
{{- end }}
