apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "labor-performance.fullname" . }}
  labels:
    {{- include "labor-performance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- /* ADR 0034: every render-time requirement of the real runtime. */}}
  {{- include "labor-performance.requireRealRuntime" . }}
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "labor-performance.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "labor-performance.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "labor-performance.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # D14 (2026-10-12): every key of the chart ConfigMap (HTTP_ADDR,
          # LOG_LEVEL, ENVIRONMENT, KAFKA_CONSUMER_GROUP, CORS_ALLOWED_ORIGINS,
          # OTEL_*, KAFKA_BROKERS) is read by cmd/labor and reaches it through
          # envFrom. The explicit `env` entries below win over envFrom for the
          # same key and carry the same values, so nothing changes for the
          # variables already set here; the checksum/config annotation rolls
          # the pods when the ConfigMap changes.
          envFrom:
            - configMapRef:
                name: {{ include "labor-performance.fullname" . }}
          env:
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: MIGRATIONS_PATH
              value: {{ .Values.config.migrationsPath | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ .Values.config.kafkaConsumerGroup | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.config.corsAllowedOrigins | quote }}
            # Outbound event publishing (ADR-0010/0013): the only publisher is
            # the Kafka transactional outbox (the binary rejects anything but
            # kafka at boot, the chart refuses to render anything else). The
            # relay's drain interval and the housekeeping sweeper envs
            # (housekeeping-sweeper ADR) follow; empty values fall back to the
            # binary's own defaults.
            - name: EVENT_PUBLISHER
              value: {{ .Values.config.eventPublisher | quote }}
            - name: OUTBOX_RELAY_INTERVAL
              value: {{ .Values.config.outboxRelayInterval | quote }}
            # ADR 0032: failed sends after which an outbox row is no longer
            # claimed (0 = unlimited).
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.config.outboxMaxAttempts | quote }}
            - name: HOUSEKEEPING_INTERVAL
              value: {{ .Values.config.housekeepingInterval | quote }}
            - name: IDEMPOTENCY_KEY_TTL
              value: {{ .Values.config.idempotencyKeyTtl | quote }}
            - name: OUTBOX_RETENTION
              value: {{ .Values.config.outboxRetention | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
            # Mandatory (ADR 0034): requireRealRuntime above refuses to render
            # without a database source and without brokers.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "labor-performance.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and ADR-0020: a direct (non-pooled) connection used only for
            # the migration step below, never for the runtime pgxpool.
            # `optional: true` so a secret without this key yet (predates
            # this chart version) still starts the pod -- the binary falls
            # back to DATABASE_URL itself when this env var is unset.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "labor-performance.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
