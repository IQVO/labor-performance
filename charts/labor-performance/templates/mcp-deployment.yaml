{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "labor-performance.mcpFullname" . }}
  labels:
    {{- include "labor-performance.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  {{- /* ADR 0034: cmd/mcp exits at boot without DATABASE_URL. */}}
  {{- include "labor-performance.requireDatabase" . }}
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "labor-performance.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "labor-performance.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "labor-performance.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            # cmd/mcp runs the same four read use cases (GetAssociateScorecard,
            # GetTaskTypePerformance, GetStandard, GetUtilization) over the same
            # OLTP database as cmd/labor, and (like it) applies migrations on
            # start — idempotent, so both binaries may point at the same
            # directory.
            - name: MIGRATIONS_PATH
              value: {{ .Values.config.migrationsPath | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "labor-performance-mcp"
            {{- end }}
            # Mandatory (ADR 0034): cmd/mcp exits at boot without it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "labor-performance.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and ADR-0020: cmd/mcp also runs migrations on start (see the
            # comment above), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "labor-performance.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- range .Values.mcp.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # cmd/mcp serves GET /healthz (200 {"status":"ok"}) next to the MCP
          # Streamable HTTP endpoint at "/" (cmd/mcp/main.go newRouter), so the
          # probes use httpGet /healthz like the OLTP REST service and the
          # reports reader (gap fix D24). /healthz needs no credentials: MCP is
          # unauthenticated by decision (ADR-0012). It answers only once
          # migrations and the database ping have succeeded, because the
          # listener starts after them.
          # startupProbe covers this fleet's known ~10s post-start
          # first-outbound-dial reset (Istio native sidecars); see
          # values.yaml's startupProbe comment for the full rationale.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
