# Mirror of what warehouse-infra sets for labor-performance
# (helm-values/_platform.yaml + helm-values/labor-performance.yaml +
# helm-values/kind-resources/labor-performance.yaml on origin/develop,
# 2026-10-19), trimmed to the keys that matter for the real runtime.
# tests/render_test.sh renders the chart with this file and asserts it still
# works after ADR 0034: infra needs NO values change.
replicaCount: 1
config:
  httpAddr: ":8080"
  migrationsPath: "migrations"
  logLevel: "info"
  kafkaConsumerGroup: "labor-performance"
  corsAllowedOrigins: "http://localhost:5173,http://localhost:5187"
  eventPublisher: kafka
kafka:
  enabled: true
  brokers: kafka.warehouse-systems.svc.cluster.local:9092
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 6
analytics:
  database:
    existingSecret: labor-performance-analytics-db
  enabled: true
  reports:
    route:
      enabled: true
      path: /api/labor-performance/reports
      parentRefs:
        - name: warehouse-gateway
          namespace: kong
          sectionName: http
    resources:
      requests:
        cpu: 25m
  projector:
    resources:
      requests:
        cpu: 25m
database:
  existingSecret: labor-performance-db
extraEnv: []
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/labor-performance-frontend
  resources:
    requests:
      cpu: 25m
gatewayApi:
  enabled: true
  parentRefs:
    - name: warehouse-gateway
      namespace: kong
      sectionName: http
  hosts:
    - path: /api/labor-performance
      pathType: PathPrefix
  stripPath: true
image:
  pullPolicy: IfNotPresent
  repository: warehouse/labor-performance
ingress:
  annotations:
    konghq.com/strip-path: 'true'
  className: kong
  enabled: false
  hosts:
    - host: ''
      paths:
        - path: /api/labor-performance
          pathType: Prefix
kongPlugins:
  cors:
    enabled: true
    origin: http://localhost
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/labor-performance
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
  resources:
    requests:
      cpu: 25m
pathCatalogue:
  content: ''
  enabled: false
resources:
  requests:
    cpu: 25m
service:
  port: 80
  targetPort: 8080
  type: ClusterIP
