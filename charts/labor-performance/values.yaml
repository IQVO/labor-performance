# Default values for labor-performance.

replicaCount: 1

image:
  repository: labor-performance
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: labor-performance.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress: block above.
# Mirrors the shape verified live in warehouse-infra's fulfillment-execution
# Gateway API pilot (Kong Ingress Controller routing HTTPRoute traffic via a
# GatewayClass annotated konghq.com/gatewayclass-unmanaged: "true"). Routes
# only to this chart's main REST API Service (same Service ingress.yaml
# already targets) — never to the reports/projector components.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) per independently-assessed
# workload, mirroring order-management's Phase 3 reference (PR #110,
# ADR-0026) — see docs/docs/adr/0019-horizontal-autoscaling-and-pgxpool-tuning.md
# for the full per-workload reasoning. Every autoscaling.<x>.enabled value
# defaults to false: this chart change makes per-workload HPA possible
# and verified-correct, but does not turn any of it on. Each guarded
# Deployment template renders WITHOUT a `replicas:` field once its own
# autoscaling.<x>.enabled flips true, so the HPA controller is the only
# writer of spec.replicas and never fights a static chart value on
# `helm upgrade`.
autoscaling:
  # cmd/labor (this Deployment, component=api): stateless OLTP HTTP +
  # Kafka consumer of warehouse.fulfillment.events. Its Kafka consumer
  # group (config.kafkaConsumerGroup, default "labor-performance") is a
  # STABLE, shared group with no per-instance uniqueness -- the fleet's
  # normal horizontally-scalable pattern, N replicas share partitions via
  # ordinary Kafka group rebalancing (same shape as order-management's
  # RepromiseConsumer under ADR-0018). The outbox relay
  # (postgres.OutboxRelay) runs per-process against each replica's own
  # unpublished rows, safe at N>1 by construction (each row is claimed
  # and published at most once via its own row-level state, not a
  # per-process cache). Nothing here breaks at N>1. max 4 / target 70%
  # CPU per the plan.
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # cmd/labor-projector: the ONLY writer of the analytical database
  # (ADR-0007). Its Kafka consumer group (AnalyticsConsumerGroup ==
  # "labor-performance-analytics") is also a STABLE, shared group with no
  # per-instance uniqueness (internal/adapters/inbound/kafka/
  # analytics_consumer.go) -- so N replicas legitimately share the
  # analytics topic's partitions via normal rebalancing, the same safe
  # shape as api's consumer group. Every write is idempotent on event_id
  # via ProcessedEvents.MarkProcessed, so correctness does not regress at
  # N>1. Capped at 2, not left at api's 4, for the same reasons
  # order-management's projector was: the topic is keyed by TaskType
  # (internal/adapters/outbound/kafka/analytics_publisher.go's
  # marshalData), so ordering is only guaranteed per-partition, and a
  # wider fan-out buys little for a lightweight idempotent-upsert
  # workload.
  projector:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  # cmd/labor-reports: stateless read-only REST reader over its own
  # read-only pgxpool (analyticsstore.NewReadOnlyPool) -- no in-memory
  # state, no Kafka consumption. Same treatment as api.
  reports:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # frontend (web/, nginx-unprivileged serving the built labor_mfe SPA
  # bundle): pure static-asset serving, no server-side session or
  # per-request state whatsoever -- the most trivially horizontally
  # scalable workload in this chart.
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# --- mcp: deliberately NOT HPA-scalable (no autoscaling.mcp block here) ---
# cmd/mcp wraps the github.com/modelcontextprotocol/go-sdk
# StreamableHTTPHandler (internal/adapters/inbound/mcp/server.go's
# mcp.NewStreamableHTTPHandler), which keeps per-process, in-memory
# session state keyed by the MCP protocol's own Mcp-Session-Id header --
# a real multi-request session, not just a TCP/HTTP connection.
# charts/labor-performance/templates/mcp-service.yaml is a plain
# ClusterIP Service with no sessionAffinity configured, so under >1
# replica a second request carrying the same Mcp-Session-Id (e.g. a
# tools/call following an earlier initialize) could land on a different
# pod than the one that created the session, which has never heard of it
# and would reject or silently start a new one. Fixing it for real needs
# either sessionAffinity: ClientIP (a partial mitigation only) or wiring
# the SDK's StreamableHTTPOptions.EventStore to a shared/external session
# store -- a real code change, out of scope for this chart-and-pool-
# tuning PR. mcp.replicaCount therefore stays a plain, manually-set value
# (see mcp: below); revisit if/when the SDK wiring adopts Stateless mode
# or an external session store. Ported verbatim from order-management's
# ADR-0026 reasoning (PR #110), which excluded its own cmd/mcp for the
# identical reason.

# deployment.environment.name on every span, metric and log this service
# exports. Set per-cluster (local / staging / production).
environment: "local"

# Falls back to in-memory adapters when database.url / database.existingSecret
# are left empty, same as running the binary locally with no env vars set.
# This service is a Kafka CONSUMER (not just a publisher, unlike
# inventory-storage) — kafka.enabled gates whether KAFKA_BROKERS is set at
# all; the consumer group id is fixed via config.kafkaConsumerGroup.
config:
  httpAddr: ":8080"
  migrationsPath: "migrations"
  logLevel: "info"        # debug | info | warn | error
  kafkaConsumerGroup: "labor-performance"
  corsAllowedOrigins: "http://localhost:5173,http://localhost:5187"

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# This service consumes warehouse.fulfillment.events (fulfillment-execution's
# TaskCompleted). kafka.enabled gates whether KAFKA_BROKERS is set in the
# container env at all — without it, the consumer goroutine still starts
# (matching the binary's own local-dev behavior) but can never reach a
# broker, so the deployment is functionally REST-only until kafka.enabled
# is true.
kafka:
  enabled: false
  brokers: "kafka:9092"

# OpenTelemetry traces + metrics, pushed over OTLP/gRPC to a Collector. The
# endpoint below is the in-cluster Collector Service in the warehouse-infra
# kind cluster. Export is non-blocking, so a Collector that is down costs
# telemetry and nothing else — but otel.enabled=false skips the env entirely.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "labor-performance"

extraEnv: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    # /readyz (ADR-0017 §graceful shutdown), NOT /healthz: readiness
    # must flip to not-ready during a graceful SIGTERM drain (see
    # cmd/labor/main.go's shutdown sequence) so this pod stops
    # receiving NEW traffic while it finishes in-flight requests --
    # /healthz stays liveness-only and never flips.
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# startupProbe covers this fleet's known ~10s post-start first-outbound-dial
# reset (Istio native sidecars; holdApplicationUntilProxyStarts is a no-op
# for them): failureThreshold * periodSeconds = 60s gives the app-side boot
# retry (internal/adapters/outbound/bootretry, ~31s worst case) room to
# finish before liveness/readiness probing (and any liveness-triggered
# restart) begins.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

# ADR-0017 §graceful shutdown: 10s HTTP/consumer/relay drain budget
# (cmd/labor/main.go's shutdownCtx) + margin for the readinessProbe's
# own periodSeconds=5 to have observed the not-ready flip before
# traffic fully stops arriving.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

# The "analytics report part" (ADR-0007): an additive read side built from
# this service's own domain events, mirroring every sibling context's
# analytics data-mesh shape. Disabled by default (enabled: false); the
# reader's DSN falls back to the projector's DSN when left empty (fine for
# local/dev, matching this fleet's documented single-role baseline).
analytics:
  enabled: false
  # Directory (inside the image) of the analytical *.up.sql migrations the
  # projector applies on start.
  migrationsPath: "migrations/analytics"
  database:
    # The projector's read-write analytical DSN.
    projectorUrl: ""
    # The reader's DSN — a read-only role where possible; falls back to the
    # projector DSN when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret with ANALYTICS_DATABASE_URL and
    # ANALYTICS_READER_DATABASE_URL keys. Takes precedence over the URLs above.
    existingSecret: ""
  projector:
    replicaCount: 1
    adminAddr: ":8091"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# --- MCP server (ADR-0009) ---
# The Model Context Protocol server (cmd/mcp): a second deployable over the
# same three read use cases (GetAssociateScorecard, GetTaskTypePerformance,
# GetStandard) and the same OLTP database as cmd/labor, served over
# Streamable HTTP at "/" (no separate healthz route — probes use a TCP
# socket check). This context exposes no write tool over MCP.
# Disabled by default so existing releases are unaffected; set
# mcp.enabled=true to deploy it.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- frontend (REMOTE Module Federation remote) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod. In the kind cluster it is reached through
# warehouse-infra's Nginx web gateway at http://localhost/mfes/labor-performance/
# -- never through Kong, which serves APIs only and must never handle HTML,
# JavaScript, CSS, fonts or images.
#
# Deliberately NO ingress/httproute/gatewayApi block here: frontend path
# routing is owned entirely by the Nginx web gateway, and the Service stays
# ClusterIP so this is not a second host-facing entrypoint.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/labor-performance-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
