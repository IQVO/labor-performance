# Local dependencies for cmd/labor, cmd/mcp, cmd/labor-projector and
# cmd/labor-reports: Postgres AND Kafka are the only runtime (ADR 0034), there
# is no in-memory mode. `docker compose up -d --wait` then, for example:
#
#   export DATABASE_URL='postgres://labor:labor@localhost:5435/labor?sslmode=disable'
#   export KAFKA_BROKERS='localhost:9092'
#   export KAFKA_CONSUMER_GROUP='labor-performance-local'
#   go run ./cmd/labor
#
# The broker (confluent-local, KRaft, single node) advertises localhost:9092
# to the host and auto-creates topics on first write, like the cluster does.
# (Port 9092 is also what the kind cluster's Kafka publishes on the host: stop
# one of the two, or map this one elsewhere and advertise the same address.)
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: labor
      POSTGRES_PASSWORD: labor
      POSTGRES_DB: labor
    ports:
      - "5435:5432"
    volumes:
      - labor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labor"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/confluent-local:7.6.1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # The ANALYTICAL database for the data product (ADR 0007) — a separate
  # database with separate credentials, written only by cmd/labor-projector
  # and read (read-only) by cmd/labor-reports. Kept as its own container
  # here so "analytics never contends with OLTP" is true locally too, not
  # just in a deployed environment. The ANALYTICS_DATABASE_URL seam allows
  # promoting it to a physically separate instance with no code change.
  analytics-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: labor_analytics
      POSTGRES_PASSWORD: labor_analytics
      POSTGRES_DB: labor_analytics
    ports:
      - "5436:5432"
    volumes:
      - labor_analytics_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labor_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  labor_pg_data:
  labor_analytics_pg_data:
